<svg xmlns="http://www.w3.org/2000/svg" width="974" height="272" viewBox="0 0 974 272" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#d1d5db" stroke-width="2"/></pattern></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20.0" y="22.0" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">Exp2: residual spatial block inserted between ConvNeXt stage 4 and the head</text>
<rect x="170.0" y="80" width="616.4" height="76" rx="10" fill="#dcfce7" fill-opacity="0.45" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="6 4"/>
<rect x="20.0" y="92.0" width="120.0" height="52.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="80.0" y="115.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">Stage 4 output</text>
<text x="80.0" y="129.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle">1024 × 12²</text>
<line x1="140.0" y1="118.0" x2="178.0" y2="118.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="180.0" y="92.0" width="79.0" height="52.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="219.5" y="115.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">1×1 conv</text>
<text x="219.5" y="129.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle">1024 → 256</text>
<line x1="261.0" y1="118.0" x2="281.0" y2="118.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="283.0" y="92.0" width="64.0" height="52.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="315.0" y="122.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">GELU</text>
<line x1="349.0" y1="118.0" x2="369.0" y2="118.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="371.0" y="92.0" width="97.3" height="52.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="419.6" y="115.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">3×3 depthwise</text>
<text x="419.6" y="129.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle">256 ch</text>
<line x1="470.3" y1="118.0" x2="490.3" y2="118.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="492.3" y="92.0" width="64.0" height="52.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="524.3" y="122.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">GELU</text>
<line x1="558.3" y1="118.0" x2="578.3" y2="118.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="580.3" y="92.0" width="146.1" height="52.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="653.3" y="115.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">1×1 conv</text>
<text x="653.3" y="129.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle">256 → 1024, zero init</text>
<line x1="728.4" y1="118.0" x2="748.4" y2="118.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="178.0" y="170.0" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="start">new block (trainable, LR 1e-5)</text>
<circle cx="762.4" cy="118.0" r="12" fill="#ffffff" stroke="#374151" stroke-width="1.4"/>
<text x="762.4" y="123.0" font-size="16" font-weight="bold" fill="#1f2937" text-anchor="middle">+</text>
<path d="M160,118.0 L160,62 L762.4,62 L762.4,104.0" fill="none" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="461.2" y="56.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle" font-style="italic">identity: the original stage-4 features pass unchanged</text>
<line x1="776.4" y1="118.0" x2="802.4" y2="118.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="804.4" y="92.0" width="150.0" height="52.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
<text x="879.4" y="115.0" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">Head (as in Exp1)</text>
<text x="879.4" y="129.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="middle">pool, LN, Linear → 5</text>
<text x="20.0" y="200.0" font-size="11" font-weight="normal" fill="#1f2937" text-anchor="start">• Extra parameters: 528,128 (0.6% of ConvNeXt-base). Trained at the backbone LR (1e-5); everything else matches Exp1.</text>
<text x="20.0" y="217.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="start">• The last 1×1 conv starts at zero, so at step 0 the block outputs exactly its input and the network equals Exp1.</text>
<text x="20.0" y="234.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="start">• Idea: let the model re-mix spatial context of the final feature map for small pets. Limit: at 12 × 12 the backbone has already</text>
<text x="20.0" y="251.0" font-size="11" font-weight="normal" fill="#4b5563" text-anchor="start">  downsampled 32×, so the block cannot recover detail that earlier stages lost.</text>
</svg>
